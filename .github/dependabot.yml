version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # Types must match the Node major we run (24, see ci.yml), not the newest one.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
