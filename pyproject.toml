[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-search"
version = "1.0.0"
description = "Fashion visual search, zero-shot tagging and virtual try-on, with a React web app"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Brindeshwar Sharma" }]
dependencies = [
    # torch/torchvision: install the CUDA build first, see README "Setup".
    "torch>=2.4",
    "torchvision>=0.19",
    "open_clip_torch>=3.0",
    "transformers>=4.40",
    "sentencepiece",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "numpy",
    "pandas",
    "pillow",
]

[project.optional-dependencies]
# Pinned to a commit: FASHN VTON is not on PyPI. Human parser is non-commercial (ADR-007).
tryon = [
    "fashn-vton @ git+https://github.com/fashn-AI/fashn-vton-1.5@7c0f10af3f91ad4048fe9729c470a13ef905d25a",
    # 1.27+ is built for CUDA 13; torch here uses CUDA 12.x, whose DLLs ORT 1.26 reuses.
    "onnxruntime-gpu>=1.20,<1.27",
]
dev = ["pytest>=8", "httpx>=0.27", "ruff==0.17.1", "pre-commit>=3.7"]

[project.scripts]
fashion-search = "fashion_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: downloads the model or datasets; skipped in CI (run with -m slow)"]
addopts = "-m 'not slow'"
