[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-search"
version = "0.1.0"
description = "Fashion visual search and zero-shot tagging with Marqo-FashionSigLIP"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Brindeshwar Sharma" }]
dependencies = [
    # torch/torchvision: install the CUDA build first, see README "Setup".
    "torch>=2.4",
    "torchvision>=0.19",
    "open_clip_torch>=3.0",
    "transformers>=4.40",
    "sentencepiece",
    "gradio>=5.0",
    "numpy",
    "pandas",
    "pillow",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.17.0", "pre-commit>=3.7"]

[project.scripts]
fashion-search = "fashion_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: downloads the model or datasets; skipped in CI (run with -m slow)"]
addopts = "-m 'not slow'"
